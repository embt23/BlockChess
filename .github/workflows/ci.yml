name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --workspace
      # D24: the adjudicator is consensus code and must build without an
      # operating system. If this breaks, something client-side has leaked in.
      - run: cargo build -p bc-adjudicator --no-default-features
      - run: cargo build -p bc-chess --no-default-features
      - run: cargo build -p bc-hash --no-default-features

  # The exact tests. perft(6) and Kiwipete perft(5) are ~310M nodes and only
  # tractable in release; RFC 8032 and the FIPS vectors are the equivalent
  # oracles for episodes 01 and 02. If this job is red, the rules are wrong and
  # nothing built on top of them means anything.
  oracles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release
      - run: cargo test -p bc-chess --release -- --ignored --nocapture
      # D23, the half that has an oracle: ~1M random positions against
      # shakmaty. This is the job that found the insufficient-material bug
      # eight hand-written tests had missed (build-log §15).
      - run: cargo test -p bc-conformance --release -- --ignored --nocapture
      # Milestone D, end to end: a published game played over the channel,
      # signed at every ply and settled. The binary asserts its own result
      # and that the ledger conserved, so a red run here means the channel
      # disagrees with a game the world has had since 1858.
      - run: cargo run -p bc-channel --release --bin play
      # Milestone E. Asserts its own verdict and that the ledger conserved.
      - run: cargo run -p bc-channel --release --bin dispute
      # The D20 calibration report, printed in the log so a regression in the
      # personality estimator is visible and not just a red assertion.
      - run: cargo run --release -p bc-style --bin calibrate
      # Episode 06's argument, run rather than recalled: the same dispute
      # on both engines, where proof-of-work reorgs away a defence that was
      # made in time and BFT does not. Asserts its own verdicts and that
      # nothing was minted.
      - run: cargo run --release -p bc-node --bin reorg
      # Episode 10: a flood starving a dispute without the reserve, failing
      # to with it, and a proposer who omits you beating it anyway. Asserts
      # all three verdicts and that nothing was minted.
      - run: cargo run --release -p bc-node --bin censor

  # The `G0` holes: code that is an episode's *subject*, which `spec/09` D26
  # says the person filming types. The tests are written and complete; they
  # are `#[ignore]`d so the suite stays green while the hole is open, and
  # this job runs them anyway so the open work is visible on every push
  # instead of living in somebody's memory.
  #
  # It reports rather than fails. A check that is red on purpose, on every
  # pull request, for weeks, teaches everyone to ignore red — which is the
  # opposite of what a CI signal is for. The failures are in the log and in
  # a workflow annotation; the job itself is green because nothing is
  # broken. When both holes close, the annotation says so and this job goes.
  g0-holes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: what is still Evan's to type
        run: |
          open=0
          echo "### episode 05 — difficulty as a control loop"
          cargo test -p bc-pow -- --ignored --nocapture || open=1
          echo "### episodes 06 and 10 — locking rules, censorship bound"
          cargo test -p bc-bft -- --ignored --nocapture || open=1
          echo "### episode 10 — the admission check that uses the bound"
          cargo test -p bc-node -- --ignored --nocapture || open=1
          if [ "$open" = "1" ]; then
            echo "::warning title=G0 holes open::An episode's subject is still \
          unwritten. See docs/g0-holes.md for the list and what each test catches."
          else
            echo "::notice title=G0 holes closed::All are implemented. Remove \
          the #[ignore] attributes and delete this job."
          fi
