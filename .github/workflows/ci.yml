name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

defaults:
  run:
    working-directory: "0.0"

jobs:
  # Version 0.0 is frozen. These jobs exist to prove the archive still builds,
  # not because 0.0 is under development.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "0.0"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --workspace

  # The exact tests. perft(6) and Kiwipete perft(5) are ~310M nodes and only
  # tractable in release; RFC 8032 and the FIPS vectors are the equivalent
  # oracles for episodes 01 and 02. If this job is red, the rules are wrong and
  # nothing built on top of them means anything.
  oracles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "0.0"
      - run: cargo test --workspace --release
      - run: cargo test -p bc-chess --release -- --ignored --nocapture

  # 0.1's Rust workspace: the engine, the PGN reader and the codec.
  # The load-bearing tests are the SAN round trip over ~200k generated moves
  # and the codec round trip over 300 random games. Both either pass on
  # everything or fail loudly.
  zero-one:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "0.1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "0.1"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --workspace
      # The rules are the oracle for everything above them. If this is red,
      # nothing else in 0.1 means anything.
      - run: cargo test -p bc-chess --release -- --ignored --nocapture
      # And the pipeline end to end, on the games in the repo.
      - run: cargo run --release -q -- pack corpus/classics.pgn /tmp/ci.bcg
      - run: cargo run --release -q -- unpack /tmp/ci.bcg /tmp/ci.pgn
      - run: cargo run --release -q -- index corpus/classics.pgn
      - run: cargo run --release -q -- book corpus/classics.pgn e4
      - run: cargo run --release -q -- grammar corpus/classics.pgn --min 2
      - run: cargo run --release -q -- think fixtures/clocks-positive.pgn --corpus fixtures/clocks-positive.pgn
      - run: cargo run --release -q -- chunks fixtures/clocks-positive.pgn --from-ply 8 --show 2

  # Every number quoted in the papers is produced by a script; this checks the
  # papers still match.
  measurements:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "0.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python measure/run_all.py --check
