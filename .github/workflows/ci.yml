name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

defaults:
  run:
    working-directory: "0.0"

jobs:
  # Version 0.0 is frozen. These jobs exist to prove the archive still builds,
  # not because 0.0 is under development.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "0.0"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --workspace

  # The exact tests. perft(6) and Kiwipete perft(5) are ~310M nodes and only
  # tractable in release; RFC 8032 and the FIPS vectors are the equivalent
  # oracles for episodes 01 and 02. If this job is red, the rules are wrong and
  # nothing built on top of them means anything.
  oracles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "0.0"
      - run: cargo test --workspace --release
      - run: cargo test -p bc-chess --release -- --ignored --nocapture

  # Version 0.1 is a measurement repo: every number quoted in the papers is
  # produced by a script here, and this job checks the papers still match.
  measurements:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "0.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python measure/run_all.py --check
